# Configuration for `cargo audit`.
# See: https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html

[advisories]
ignore = [
    # RUSTSEC-2026-0097: rand is unsound when a custom global logger calls
    # `rand::rng()` during initialization.
    # https://rustsec.org/advisories/RUSTSEC-2026-0097
    #
    # Not applicable to splitrail:
    #   * We do not depend on `rand` directly and do not install a custom
    #     logger that touches rand APIs.
    #   * The only flagged version comes from a feature-gated transitive
    #     dependency that is never compiled into our binary:
    #       - rand 0.8.5 -> phf_generator 0.11.3 -> phf 0.11.3 -> termwiz ->
    #         ratatui-termwiz (enabled only by ratatui's optional `termwiz`
    #         feature; we use ratatui with default features, so `termwiz` is
    #         off).
    #     `cargo audit` reads Cargo.lock, which unions all optional
    #     dependencies regardless of feature selection, hence the false
    #     positive.
    #   * The other lockfile copy of rand, reached through
    #     quinn-proto -> quinn -> reqwest's optional `http3` feature (off for
    #     us), is rand 0.10.3, which the advisory lists as patched.
    #
    # Re-evaluate once phf_generator adopts a patched rand (>= 0.8.6 on its
    # current line, or >= 0.10.1); the ignore can then be removed.
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0189: DNS rebinding vulnerability in rmcp's Streamable
    # HTTP server transport (CVE-2026-42559), fixed in rmcp >= 1.4.0.
    # https://rustsec.org/advisories/RUSTSEC-2026-0189
    #
    # Not applicable to splitrail:
    #   * The vulnerable code lives entirely in
    #     `rmcp::transport::streamable_http_server`, which is only compiled
    #     in when the `transport-streamable-http-server` feature (or its
    #     `server-side-http` dependency) is enabled.
    #   * We depend on rmcp with `features = ["server", "macros",
    #     "transport-io"]`. `transport-io` is the stdio transport; it does
    #     not pull in `server-side-http` or any HTTP transport, so the
    #     advisory's affected module is never compiled into our binary.
    #   * Per the advisory, non-HTTP transports (stdio, child-process) are
    #     explicitly unaffected.
    #
    # Re-evaluate if splitrail ever enables an HTTP-based MCP transport, or
    # when upgrading rmcp past its current 0.x line (a >=1.4.0 upgrade is a
    # separate, larger change due to upstream API churn between rmcp 0.12
    # and 1.x).
    "RUSTSEC-2026-0189",

    # RUSTSEC-2026-0462: rmcp's Streamable HTTP clients read non-streaming
    # response bodies into memory with no size limit, so a malicious MCP
    # server can exhaust the client's memory. Fixed in rmcp >= 3.9.0.
    # https://rustsec.org/advisories/RUSTSEC-2026-0462
    #
    # Not applicable to splitrail:
    #   * The affected code is rmcp's HTTP *client* transport, compiled only
    #     with the `transport-streamable-http-client-reqwest` or
    #     `transport-streamable-http-client-unix-socket` features.
    #   * Splitrail is an MCP *server* over stdio. We enable `server`,
    #     `macros`, and `transport-io`; `cargo tree -e features -i rmcp`
    #     shows only those plus `transport-async-rw`, `base64`, and
    #     `default`, so no HTTP client is compiled in.
    #   * Splitrail never connects to an MCP server, so no server can send it
    #     a response body in the first place.
    #
    # Re-evaluate together with RUSTSEC-2026-0189 above: if splitrail enables
    # an HTTP-based MCP transport or MCP client, or once rmcp is upgraded to
    # >= 3.9.0, after which both ignores can be removed.
    "RUSTSEC-2026-0462",
]
